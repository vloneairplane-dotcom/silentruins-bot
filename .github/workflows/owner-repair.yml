name: SilentRuins Owner Repair

on:
  push:
    branches:
      - 'arena/01a07f23-silentruins-bot'

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: ${{ !startsWith(github.event.head_commit.message, 'Owner Repair:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: arena/01a07f23-silentruins-bot

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Repair music selector and delivery accounting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('def get_next_track(mood=None, peek=False):')
          end = text.index('\n\ndef consume_track(track):', start)

          replacement = '''def get_next_track(mood=None, peek=False):
              """Return a safe music candidate without ever selecting from an empty list.

              Production selection respects the persistent no-repeat cycle and the
              recent-track cooldown. Preview selection is isolated from production:
              it records only preview candidates so repeated /preview calls and the
              candidate-scoring loop do not keep evaluating the exact same track.
              """
              lib = load_library()
              tracks = [t for t in lib.get("tracks", []) if t and t.get("file_id")]
              if not tracks:
                  return None

              state = load_state()
              recent_ids = [x for x in (state.get("recent_track_ids", []) or []) if x]
              cooldown_ids = set(recent_ids[-MUSIC_COOLDOWN_POSTS:])
              by_id = {t.get("file_id"): t for t in tracks}

              if peek:
                  preview_recent = [x for x in (state.get("preview_recent_track_ids", []) or []) if x]
                  preview_excluded = set(preview_recent[-MAX_CANDIDATES:])
                  pool = [t for t in tracks if t.get("file_id") not in cooldown_ids and t.get("file_id") not in preview_excluded]
                  if not pool:
                      pool = [t for t in tracks if t.get("file_id") not in cooldown_ids]
                  if not pool:
                      pool = tracks[:]
                  if not pool:
                      return None

                  if mood:
                      ranked = sorted(
                          pool,
                          key=lambda t: track_match(t, mood, MOODS, MOOD_ALIASES),
                          reverse=True,
                      )
                      if ranked:
                          top_score = track_match(ranked[0], mood, MOODS, MOOD_ALIASES)
                          threshold = max(0.70, top_score - 0.08)
                          shortlist = [
                              t for t in ranked
                              if track_match(t, mood, MOODS, MOOD_ALIASES) >= threshold
                          ]
                          # Critical fallback: threshold filtering must never produce
                          # an empty list. The best-ranked candidates remain valid.
                          if not shortlist:
                              shortlist = ranked[: min(5, len(ranked))]
                          chosen = random.choice(shortlist)
                      else:
                          chosen = random.choice(pool)
                  else:
                      chosen = random.choice(pool)

                  preview_recent.append(chosen.get("file_id"))
                  state["preview_recent_track_ids"] = preview_recent[-MAX_CANDIDATES:]
                  save_state(state)
                  return chosen

              valid_unplayed = [fid for fid in (lib.get("unplayed", []) or []) if fid in by_id]
              lib["unplayed"] = valid_unplayed

              if not lib["unplayed"]:
                  eligible = [t for t in tracks if t.get("file_id") not in cooldown_ids]
                  if not eligible:
                      eligible = tracks[:]
                  lib["unplayed"] = [t.get("file_id") for t in eligible]
                  random.shuffle(lib["unplayed"])

              chosen_id = None
              if mood:
                  ranked_ids = sorted(
                      lib["unplayed"],
                      key=lambda fid: track_match(by_id[fid], mood, MOODS, MOOD_ALIASES),
                      reverse=True,
                  )
                  for fid in ranked_ids:
                      if fid not in cooldown_ids:
                          chosen_id = fid
                          break

              if chosen_id is None:
                  for fid in lib["unplayed"]:
                      if fid not in cooldown_ids:
                          chosen_id = fid
                          break

              # Final hard fallback: if the entire remaining queue is inside the
              # cooldown, use its oldest item instead of crashing the bot.
              if chosen_id is None and lib["unplayed"]:
                  chosen_id = lib["unplayed"][0]
              if chosen_id is None:
                  return None

              lib["unplayed"].remove(chosen_id)
              save_library(lib)
              return by_id.get(chosen_id)
'''

          text = text[:start] + replacement + text[end:]

          start = text.index('async def send_track(context, chat_id, track, reply_to=None):')
          end = text.index('\n\ndef delete_track_by_number', start)
          replacement = '''async def send_track(context, chat_id, track, reply_to=None):
              """Send audio first; record a play only after Telegram accepts it."""
              if not track:
                  return None
              caption = build_audio_caption(track)
              file_path = track.get("file_path")
              if file_path and Path(file_path).exists():
                  with open(file_path, "rb") as f:
                      message = await context.bot.send_audio(
                          chat_id=chat_id,
                          audio=f,
                          caption=caption,
                          title=(track.get("title") or None),
                          performer=(track.get("performer") or None),
                          reply_to_message_id=reply_to,
                      )
              else:
                  message = await context.bot.send_audio(
                      chat_id=chat_id,
                      audio=track["file_id"],
                      caption=caption,
                      reply_to_message_id=reply_to,
                  )
              try:
                  DB.track_played(track.get("file_id"))
              except Exception:
                  logger.exception("Failed to record track play")
              return message
'''
          text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding='utf-8')
          print('Owner repair applied to bot.py')
          PY

      - name: Add regression tests
        run: |
          mkdir -p tests
          cat > tests/test_content_engine.py <<'PY'
          import random
          from content_engine import MOOD_PROFILES, MUSIC_TAG_MAP, choose_mood, track_match, caption_quality

          MOODS = {
              name: {
                  'queries': [name],
                  'captions': ['شب آرام است و یک خاطره هنوز بیدار است.'],
              }
              for name in MOOD_PROFILES
          }

          def test_track_match_is_total_and_bounded():
              for mood in MOODS:
                  assert 0.0 <= track_match({'mood': 'unknown', 'title': '', 'performer': ''}, mood, MOODS) <= 1.0
                  assert 0.0 <= track_match(None, mood, MOODS) <= 1.0

          def test_caption_quality_never_leaves_unit_interval():
              for mood in MOODS:
                  score = caption_quality('شب آرام است و یک خاطره هنوز بیدار است.', mood)
                  assert 0.0 <= score <= 1.0

          def test_choose_mood_never_returns_invalid_value():
              random.seed(7)
              for hour in range(24):
                  assert choose_mood(MOODS, {'recent_moods': []}, hour) in MOODS
          PY

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax and regression checks
        run: |
          python -m py_compile bot.py content_engine.py database.py tests/test_content_engine.py
          python -m pytest -q tests/test_content_engine.py
          python - <<'PY'
          from pathlib import Path
          s = Path('bot.py').read_text(encoding='utf-8')
          assert 'random.choice(top[:' not in s, 'unsafe empty-list selector still present'
          assert 'if not shortlist:' in s, 'music shortlist fallback missing'
          assert 'preview_recent_track_ids' in s, 'preview isolation missing'
          print('Static owner-mode checks passed')
          PY

      - name: Commit repaired code
        run: |
          git config user.name 'SilentRuins Owner Mode'
          git config user.email 'silentruins-owner-mode@users.noreply.github.com'
          git add bot.py tests/test_content_engine.py
          git commit -m 'Owner Repair: harden preview and music rotation' || exit 0
          git push origin HEAD:arena/01a07f23-silentruins-bot

      - name: Remove one-shot repair workflow
        if: success()
        run: |
          git rm .github/workflows/owner-repair.yml
          git commit -m 'Owner Repair: remove one-shot repair workflow'
          git push origin HEAD:arena/01a07f23-silentruins-bot
